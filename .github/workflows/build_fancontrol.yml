name: Build fancontrol IPKs

on:
  push:
    branches:
      - mvebu/cortexa72
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMMORTAL_TAG: v24.10.1
      PACKAGE_FEED: "src-git fancontrol https://github.com/JiaY-shi/fancontrol.git"
      TARGET: mvebu/cortexa72
      DUALBUILDBOT: false
      PACKAGE_LIST: fancontrol,luci-app-fancontrol

    steps:
    - name: Checkout build-scripts
      uses: actions/checkout@v4
      with:
        repository: immortalwrt/build-scripts
        path: build-scripts

    - name: Fetch ImmortalWRT
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        git fetch --tags
        git checkout $IMMORTAL_TAG

    - name: Inject fancontrol feed
      run: |
        echo "$PACKAGE_FEED" >> openwrt/feeds.conf.local

    - name: Compile fancontrol & LuCI
      run: |
        cd openwrt
        # 1) Pull in ALL feeds (including your custom one in feeds.conf.local)
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # 2) Ensure your packages are selected (optional if you did menuconfig)
        # echo "CONFIG_PACKAGE_fancontrol=y" >> .config
        # echo "CONFIG_PACKAGE_luci-app-fancontrol=y" >> .config
        # make defconfig

        # 3) Build just the two packages
        make package/fancontrol/{clean,compile} V=s
        make package/luci-app-fancontrol/{clean,compile} V=s

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: fancontrol-packages
        path: |
          openwrt/bin/packages/**/fancontrol_*.ipk
          openwrt/bin/packages/**/luci-app-fancontrol_*.ipk
