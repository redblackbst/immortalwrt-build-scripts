name: Build fancontrol IPKs

on:
  push:
    branches: [ mvebu/cortexa72, main ]
  workflow_dispatch:

env:
  IMMORTAL_TAG: v24.10.1
  TARGET: mvebu/cortexa72

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: immortalwrt/immortalwrt
        path: openwrt
        fetch-depth: 0

    - name: Cache host, toolchain & dl
      uses: actions/cache@v4
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain-*
          openwrt/dl
        key: ${{ runner.os }}-immortalwrt-${{ env.IMMORTAL_TAG }}

    - name: Prepare feeds & config
      run: |
        cd openwrt
        cp feeds.conf.default feeds.conf
        echo "src-git fancontrol https://github.com/JiaY-shi/fancontrol.git" >> feeds.conf
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "CONFIG_TARGET_mvebu=y"               >> .config
        echo "CONFIG_TARGET_mvebu_cortexa72=y"     >> .config
        echo "CONFIG_TARGET_ARCH_PACKAGES=aarch64_cortex-a72" >> .config
        echo "CONFIG_USE_APK=n"                      >> .config
        echo "CONFIG_PACKAGE_fancontrol=y"           >> .config
        echo "CONFIG_PACKAGE_luci-app-fancontrol=y"  >> .config
        make defconfig

    - name: Bootstrap toolchain & kernel
      run: |
        cd openwrt
        make -j$(nproc) {toolchain,target}/compile

    - name: Compile fancontrol & LuCI
      run: |
        cd openwrt
        make -j$(nproc) package/{fancontrol,luci-app-fancontrol}/compile V=s

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: fancontrol-packages
        path: openwrt/bin/packages/*/fancontrol/*.ipk
