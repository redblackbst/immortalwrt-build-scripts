name: Build fancontrol IPKs

on:
  push:
    branches:
      - mvebu/cortexa72
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENWRT_RELEASE: 24.10.1
      TARGET: mvebu/cortexa72

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download OpenWrt SDK
      run: |
        ARCH="${{ env.TARGET%%/* }}"
        SUBTARGET="${{ env.TARGET#*/ }}"
        SDK_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_RELEASE }}/targets/${ARCH}/${SUBTARGET}/openwrt-sdk-${{ env.OPENWRT_RELEASE }}-${ARCH}-${SUBTARGET}_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
        wget -qO sdk.tar.xz "$SDK_URL"
        tar -xJf sdk.tar.xz
        mv openwrt-sdk-* openwrt-sdk

    - name: Inject fancontrol feed
      run: |
        cd openwrt-sdk
        cp feeds.conf.default feeds.conf
        echo "src-git fancontrol https://github.com/JiaY-shi/fancontrol.git" >> feeds.conf

    - name: Update feeds & select packages
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "CONFIG_PACKAGE_fancontrol=y"         >> .config
        echo "CONFIG_PACKAGE_luci-app-fancontrol=y" >> .config
        make defconfig

    - name: Compile fancontrol & LuCI
      run: |
        cd openwrt-sdk
        make package/fancontrol/compile V=s
        make package/luci-app-fancontrol/compile V=s

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: fancontrol-packages
        path: |
          openwrt/bin/packages/**/fancontrol_*.ipk
          openwrt/bin/packages/**/luci-app-fancontrol_*.ipk
